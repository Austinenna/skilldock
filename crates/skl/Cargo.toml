[package]
name = "skl"
version = "0.2.0"
edition = "2021"
description = "SkillDock core: develop, test, publish and route agent skills via symlinks"
license = "MIT"

[lib]
name = "skilldock_core"
path = "src/lib.rs"

[[bin]]
name = "skl"
path = "src/main.rs"

[dependencies]
dirs = "6"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
toml_edit = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
